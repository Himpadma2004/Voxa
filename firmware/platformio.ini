; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    lovyan03/LovyanGFX
    Wire
    https://github.com/ricmoo/qrcode.git
    bblanchon/ArduinoJson @ ^7.0.4

build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -D LGFX_USE_V1
    ; Enable 8MB embedded PSRAM (OPI/AP_3v3 type on this chip)
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D CONFIG_SPIRAM_CACHE_WORKAROUND
    ; Suppress the ESP32 core's own internal log_e()/log_w() prints (e.g. the
    ; "WiFiClient.cpp:429 write(): fail ... errno 104" line). This is COSMETIC
    ; ONLY — it silences the framework's low-level socket error prints but does
    ; NOT change any behavior. Our own [Upload]/[Health]/etc. Serial prints are
    ; untouched and will still show the retry/failure sequence.
    ; Levels: 0=None 1=Error 2=Warn 3=Info 4=Debug 5=Verbose
    -D CORE_DEBUG_LEVEL=0

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi